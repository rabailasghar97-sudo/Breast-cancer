name: Breast cancer research benchmark
on:
  push:
    branches: [main]
    paths: [".github/workflows/study.yml"]
  workflow_dispatch:
    inputs:
      run_real:
        description: Run the real TCGA-BRCA benchmark
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m breast_cancer.demo --output outputs/synthetic
          python -m breast_cancer.study --inputs outputs/synthetic --output outputs/synthetic/metrics.json --kind synthetic --folds 3 --inner 2 --features 8 --hidden 4 --seeds 42
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-metrics
          path: outputs/synthetic/metrics.json
  real:
    needs: smoke
    if: github.event_name == 'push' || inputs.run_real
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Match clinical, STAR TPM and UNI2-h slide data
        run: |
          mkdir -p outputs/real
          set -o pipefail
          python -u -m breast_cancer.prepare --output outputs/real 2>&1 | tee outputs/real/processing.log
      - name: Fit and evaluate real PFI models
        run: python -m breast_cancer.study --inputs outputs/real --output outputs/real/metrics.json --kind real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-brca-aggregate
          path: |
            outputs/real/cohort_audit.json
            outputs/real/processing.json
            outputs/real/metrics.json
            outputs/real/processing.log
